{% extends "base.html" %}
{% block title %}{{ title }} — Портал ЕЦП{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto space-y-4" data-section="{{ section }}" data-title="{{ title }}" id="docsRoot">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-xl font-bold dark:text-white">{{ title }}</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Список файлов</p>
    </div>
    <button id="docsAddBtn" onclick="docsOpenAdd()" class="hidden inline-flex items-center px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-sm">
      <i class="fa-solid fa-plus mr-2"></i> Добавить
    </button>
  </div>

  <div id="docsList" class="space-y-2"></div>

  <div id="docsEmpty" class="hidden py-16 text-center text-slate-400">
    <i class="fa-solid fa-folder-open text-4xl mb-3 opacity-30 block"></i>
    <p class="text-sm">Список пуст. Нажмите «Добавить», чтобы загрузить первый файл.</p>
  </div>
</div>

<!-- Модалка добавления -->
<div id="docsModal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4">
  <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full shadow-2xl overflow-hidden">
    <div class="px-5 py-3 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between bg-slate-50 dark:bg-slate-700">
      <h3 class="text-base font-bold dark:text-white">Новый файл — <span id="docsModalTitle"></span></h3>
      <button onclick="docsCloseAdd()" class="p-1.5 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form onsubmit="docsSubmit(event)" class="p-5 space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Название *</label>
        <input id="docsTitle" type="text" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Дата</label>
        <input id="docsDate" type="date" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Файл *</label>
        <div class="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl p-4 text-center cursor-pointer hover:border-indigo-400" onclick="document.getElementById('docsFile').click()">
          <i class="fa-solid fa-file-arrow-up text-2xl text-indigo-500 mb-1"></i>
          <p id="docsFileLabel" class="text-xs text-slate-500 dark:text-slate-400">Нажмите, чтобы выбрать файл</p>
          <input id="docsFile" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.txt" class="hidden" onchange="docsFileChosen(event)">
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-3 border-t border-slate-200 dark:border-slate-700">
        <button type="button" onclick="docsCloseAdd()" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 text-sm rounded-xl">Отмена</button>
        <button type="submit" id="docsSubmitBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-xl">Загрузить</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function() {
  const root = document.getElementById('docsRoot');
  const SECTION = root.dataset.section;
  const TITLE = root.dataset.title;
  let uploadedFile = null;  // имя файла после загрузки на сервер

  function fmtDate(iso) {
    if (!iso) return '';
    const p = String(iso).split('-');
    return p.length === 3 ? `${p[2]}.${p[1]}.${p[0]}` : iso;
  }

  async function refresh() {
    const res = await fetch('/api/docs/' + SECTION + '?_=' + Date.now()).then(r => r.json());
    const items = (res && res.items) || [];
    const list = document.getElementById('docsList');
    const empty = document.getElementById('docsEmpty');
    if (!items.length) {
      list.innerHTML = '';
      empty.classList.remove('hidden');
    } else {
      empty.classList.add('hidden');
      list.innerHTML = items.map(it => `
        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 flex items-center gap-3 shadow-sm">
                    <div class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 flex items-center justify-center flex-shrink-0">
            <i class="fa-solid ${it.file.toLowerCase().endsWith('.pdf') ? 'fa-file-pdf text-rose-500' : 'fa-file-lines'}"></i>
          </div>
          <div class="min-w-0 flex-1">
            <div class="font-semibold text-slate-900 dark:text-white text-sm truncate">${escapeHtml(it.title)}</div>
            <div class="text-xs text-slate-500 dark:text-slate-400">${fmtDate(it.date)}</div>
          </div>
          <a href="/uploads/${encodeURIComponent(it.file)}" target="_blank" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-xs rounded-lg">
            <i class="fa-solid fa-download mr-1"></i> Скачать
          </a>
          <button onclick="docsDelete('${it.id}')" class="px-3 py-1.5 bg-rose-50 dark:bg-rose-900/30 hover:bg-rose-100 text-rose-600 dark:text-rose-400 text-xs rounded-lg">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      `).join('');
    }
    // Кнопка «Добавить» — только для руководителя
    const addBtn = document.getElementById('docsAddBtn');
    if (isManager()) addBtn.classList.remove('hidden');
  }

  window.docsOpenAdd = function() {
    if (!isManager()) return;
    uploadedFile = null;
    document.getElementById('docsModalTitle').textContent = TITLE;
    document.getElementById('docsTitle').value = '';
    document.getElementById('docsDate').value = new Date().toISOString().slice(0,10);
    document.getElementById('docsFileLabel').textContent = 'Нажмите, чтобы выбрать файл';
    document.getElementById('docsModal').classList.remove('hidden');
    document.getElementById('docsModal').classList.add('flex');
  };
  window.docsCloseAdd = function() {
    document.getElementById('docsModal').classList.add('hidden');
    document.getElementById('docsModal').classList.remove('flex');
  };

  window.docsFileChosen = async function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const label = document.getElementById('docsFileLabel');
    label.textContent = 'Загрузка: ' + file.name + '...';
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res = await fetch('/api/upload', { method: 'POST', body: fd }).then(r => r.json());
      if (res.ok) {
        uploadedFile = res.file;
        label.textContent = '✓ ' + file.name;
      } else {
        label.textContent = 'Ошибка загрузки';
        uploadedFile = null;
      }
    } catch (err) {
      label.textContent = 'Ошибка загрузки';
      uploadedFile = null;
    }
  };

  window.docsSubmit = async function(e) {
    e.preventDefault();
    const title = document.getElementById('docsTitle').value.trim();
    const date = document.getElementById('docsDate').value;
    if (!title || !uploadedFile) {
      if (!uploadedFile) alert('Выберите файл');
      return;
    }
    const btn = document.getElementById('docsSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'Сохранение...';
    try {
      const res = await fetch('/api/docs/' + SECTION, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title, file: uploadedFile, date: date })
      }).then(r => r.json());
      if (res.ok) {
        docsCloseAdd();
        await refresh();
        toast('Файл добавлен');
      } else {
        alert('Ошибка: ' + (res.error || 'неизвестно'));
      }
    } finally {
      btn.disabled = false;
      btn.textContent = 'Загрузить';
    }
  };

  window.docsDelete = async function(id) {
    if (!isManager()) return;
    if (!confirm('Удалить файл из списка?')) return;
    const res = await fetch('/api/docs/' + SECTION + '/' + id, { method: 'DELETE' }).then(r => r.json());
    if (res.ok) {
      await refresh();
      toast('Удалено');
    } else {
      toast('Ошибка удаления', 'error');
    }
  };

  document.addEventListener('DOMContentLoaded', refresh);
})();
</script>
{% endblock %}
