{% extends "base.html" %}
{% block title %}{{ page.title }} — Портал ЕЦП{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">
  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-3">
      <a href="/pages" class="p-2 hover:bg-slate-100 rounded-lg" title="К списку страниц"><i class="fa-solid fa-arrow-left text-slate-500"></i></a>
      <div>
        <h1 class="text-xl font-bold">{{ page.title }}</h1>
        <p class="text-xs text-slate-500" id="pageSubtitle">Страница портала</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="editPageBtn" onclick="startEditPage()" class="role-hidden inline-flex items-center px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded-xl">
        <i class="fa-solid fa-pen mr-1"></i> Редактировать
      </button>
      <button id="savePageBtn" onclick="savePageContent()" class="hidden inline-flex items-center px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium rounded-xl">
        <i class="fa-solid fa-check mr-1"></i> Сохранить
      </button>
      <button id="cancelEditBtn" onclick="cancelEditPage()" class="hidden inline-flex items-center px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-medium rounded-xl">
        Отмена
      </button>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm">
    <div id="pageContent" class="prose max-w-none p-6" data-page-id="{{ page.id }}">{{ page.content|safe }}</div>
    <div id="pageEditor" class="hidden p-6 space-y-2">
      <div class="flex flex-wrap gap-1 p-2 bg-slate-50 border border-slate-200 rounded-lg">
        <button onclick="document.execCommand('bold')" class="px-2 py-1 text-xs hover:bg-white rounded font-bold">Ж</button>
        <button onclick="document.execCommand('italic')" class="px-2 py-1 text-xs hover:bg-white rounded italic">К</button>
        <button onclick="document.execCommand('underline')" class="px-2 py-1 text-xs hover:bg-white rounded underline">Ч</button>
        <div class="w-px bg-slate-300 mx-1"></div>
        <button onclick="document.execCommand('formatBlock',false,'h2')" class="px-2 py-1 text-xs hover:bg-white rounded font-bold">H2</button>
        <button onclick="document.execCommand('formatBlock',false,'h3')" class="px-2 py-1 text-xs hover:bg-white rounded font-bold">H3</button>
        <button onclick="document.execCommand('formatBlock',false,'p')" class="px-2 py-1 text-xs hover:bg-white rounded">¶</button>
        <div class="w-px bg-slate-300 mx-1"></div>
        <button onclick="document.execCommand('insertUnorderedList')" class="px-2 py-1 text-xs hover:bg-white rounded">• Список</button>
        <button onclick="document.execCommand('insertOrderedList')" class="px-2 py-1 text-xs hover:bg-white rounded">1. Список</button>
        <div class="w-px bg-slate-300 mx-1"></div>
        <button onclick="insertLink()" class="px-2 py-1 text-xs hover:bg-white rounded"><i class="fa-solid fa-link mr-1"></i>Ссылка</button>
        <button onclick="insertImage()" class="px-2 py-1 text-xs hover:bg-white rounded"><i class="fa-solid fa-image mr-1"></i>Картинка</button>
      </div>
      <div id="editArea" contenteditable="true" class="min-h-[300px] p-4 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='pages.js') }}"></script>{% endblock %}
